name: Import exact HyperData asset

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  import:
    if: ${{ !exists('assets/hyperdata-ai-avatar-hero-03.png') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download exact upstream asset
        run: |
          set -euo pipefail
          mkdir -p assets
          curl --fail --location --retry 3 --connect-timeout 15 \
            https://raw.githubusercontent.com/Co-Messi/HyperData-Terminal/main/assets/hyperdata-ai-avatar-hero-03.png \
            -o assets/hyperdata-ai-avatar-hero-03.png
          file assets/hyperdata-ai-avatar-hero-03.png
          test "$(xxd -p -l 8 assets/hyperdata-ai-avatar-hero-03.png)" = "89504e470d0a1a0a"

      - name: Commit exact asset and remove temporary workflow
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/hyperdata-ai-avatar-hero-03.png
          git rm .github/workflows/import-hyperdata-asset.yml
          git commit -m "Add exact HyperData visual asset"
          git push origin HEAD:main
