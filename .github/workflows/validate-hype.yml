name: validate-hype-mega-radar
on:
  push:
    branches: ["main","rebuild/**"]
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t hype-validate .
      - name: Python syntax
        run: docker run --rm --entrypoint python hype-validate -m py_compile /app/signal_engine.py /app/mega_ui.py
      - name: Import engine
        run: docker run --rm --entrypoint python hype-validate -c "import signal_engine; print('signal_engine import OK')"
      - name: Signal-only guard
        run: |
          ! grep -R "create_order\|adjust_trade_position\|freqtrade trade\|place_order" -n signal_engine.py mega_ui.py
