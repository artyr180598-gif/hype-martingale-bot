services:
  # Единый движок v3. Для Railway/одного процесса используйте v3-daemon;
  # для multi-service деплоя — v3-api + v3-worker (общий volume ./data).
  v3-daemon:
    image: hype-futures-engine
    build: .
    container_name: hype-futures-engine
    env_file:
      - .env
    environment:
      RUN_V3: "true"
      V3_COMMAND: "daemon"
      PORT: ${PORT:-8400}
    ports:
      - "${PORT:-8400}:${PORT:-8400}"
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    command: ["./entrypoint.sh"]
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:${PORT:-8400}/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  v3-api:
    image: hype-futures-engine
    build: .
    container_name: hype-futures-api
    env_file:
      - .env
    environment:
      V3_COMMAND: "serve"
      PORT: ${V3_PORT:-8400}
    ports:
      - "${V3_PORT:-8400}:${V3_PORT:-8400}"
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    command: ["python", "-m", "v3", "serve", "--host", "0.0.0.0", "--port", "${V3_PORT:-8400}"]
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:${V3_PORT:-8400}/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  v3-worker:
    image: hype-futures-engine
    build: .
    container_name: hype-futures-worker
    env_file:
      - .env
    environment:
      V3_COMMAND: "watch"
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    command: ["python", "-m", "v3", "watch"]
    depends_on:
      - v3-api
