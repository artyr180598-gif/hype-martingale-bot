version: "3.8"

services:
  hype-ultimate:
    build: .
    container_name: hype-ultimate
    restart: unless-stopped
    ports:
      - "${PORT:-8400}:8400"
    env_file:
      - .env
    environment:
      - HOST=0.0.0.0
      - PORT=8400
      - DATA_DIR=/app/data
    volumes:
      - ./data:/app/data
    command: ["daemon"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8400/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
