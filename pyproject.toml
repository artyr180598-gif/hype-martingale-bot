[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "crypto-futures-intelligence"
version = "0.1.0"
description = "Crypto futures market intelligence, research, signals and paper trading platform"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116,<1",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "sqlalchemy[asyncio]>=2.0,<3",
  "asyncpg>=0.30,<1",
  "alembic>=1.16,<2",
  "redis>=6,<8",
  "httpx>=0.28,<1",
  "numpy>=2.2,<3",
  "pandas>=2.2,<3",
  "structlog>=25,<26",
  "prometheus-client>=0.22,<1",
  "tenacity>=9,<10",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
  "pytest-asyncio>=1,<2",
  "ruff>=0.12,<1",
  "mypy>=1.17,<2",
]
telegram = ["aiogram>=3.21,<4"]
exchange = ["ccxt>=4.5,<5"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true

[tool.hatch.build.targets.wheel]
packages = ["app"]
