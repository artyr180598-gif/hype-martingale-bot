[project]
name = "hype-futures-engine"
version = "3.0.0"
description = "HYPE Futures Signal Intelligence — AI/quant crypto futures analyst: scanning, multi-timeframe analysis, NO-TRADE gate, walk-forward, lifecycle, Telegram, observability"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "numpy>=1.26.4",
    "pandas>=2.2.1",
    "httpx>=0.27.0",
    "aiohttp>=3.9.3",
    "aiogram>=3.4.0",
    "matplotlib>=3.8.0",
]

[project.scripts]
hype-engine = "v3.cli:main"

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --asyncio-mode=auto"
testpaths = ["v3/tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501", "F401", "F841"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
disallow_untyped_defs = false
